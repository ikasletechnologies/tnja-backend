version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tnja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tnja
      POSTGRES_PASSWORD: tnja
      POSTGRES_DB: tnja
    ports:
      - '5432:5432'
    volumes:
      - tnja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tnja -d tnja']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API removed ──────────────────────────────
  # ── Frontend (Next.js) removed ──────────────────────

volumes:
  tnja_pgdata:
    driver: local
