version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tnja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tnja
      POSTGRES_PASSWORD: tnja
      POSTGRES_DB: tnja
    ports:
      - '5432:5432'
    volumes:
      - tnja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tnja -d tnja']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tnja_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tnja:tnja@postgres:5432/tnja
      PORT: 5000
      NODE_ENV: development
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tnja_uploads:/app/uploads

  # ── Frontend (Next.js) ──────────────────────
  frontend:
    build:
      context: ../tnja-frontend
      dockerfile: Dockerfile
    container_name: tnja_frontend
    restart: unless-stopped
    env_file: ../tnja-frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  tnja_pgdata:
    driver: local
  tnja_uploads:
    driver: local
